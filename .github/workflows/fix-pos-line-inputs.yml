name: Apply POS line input fixes

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply POS source patch
        run: python .github/pos-line-fix.py
      - name: Commit POS source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/sales/page.tsx app/dashboard/purchases/page.tsx app/dashboard/mobile-voucher-final.module.css .github/workflows/fix-pos-line-inputs.yml .pos-line-fix-trigger .github/pos-line-fix.py
          git rm -f .github/workflows/fix-pos-line-inputs.yml .github/pos-line-fix.py .pos-line-fix-trigger
          git commit -m 'Fix POS line inputs and duplicate products [pos-line-fix]'
          git push
