name: Apply invoice profit page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch invoice analysis and viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Profit Analysis: use the shared full invoice viewer instead of a second modal.
          p = Path('app/dashboard/analysis/page.tsx')
          s = p.read_text()
          s = s.replace(', X, Eye, ArrowLeft', '')
          s = s.replace(', X, Eye, ArrowLeft }', ' }')
          s = s.replace(", WalletCards, X, Eye, ArrowLeft }", ", WalletCards }")
          s = s.replace("; const [selectedInvoice,setSelectedInvoice]=useState<Report['profitAnalysis']['invoiceWise'][number]|null>(null)", '')
          s = s.replace("<td className=\"p-3 font-black\">{inv.invoice_no}</td>", "<td className=\"p-3\"><button type=\"button\" className=\"font-black text-indigo-700 underline decoration-indigo-300 underline-offset-2 hover:text-indigo-900\" title=\"Open invoice\">{inv.invoice_no}</button></td>")
          s = s.replace("<td className=\"p-3 text-center\"><button onClick={()=>setSelectedInvoice(inv)} className=\"inline-flex items-center gap-1.5 rounded-lg bg-indigo-50 px-3 py-2 text-xs font-black text-indigo-700 hover:bg-indigo-100\"><Eye className=\"h-3.5 w-3.5\"/> View</button></td>", "<td className=\"p-3 text-center\"><span className=\"text-xs font-bold text-indigo-600\">Open invoice</span></td>")
          start = s.find('\n  {selectedInvoice&&<div className=\"fixed inset-0 z-[10000]')
          if start != -1:
              end = s.find('\n}\nfunction ReportCard', start)
              if end == -1:
                  raise SystemExit('selectedInvoice modal end marker not found')
              s = s[:start] + s[end:]
          elif 'selectedInvoice&&' in s:
              raise SystemExit('selectedInvoice marker found but start did not match')
          p.write_text(s)

          # Shared InvoiceViewer: make it the front-most invoice page and add product-wise profit/loss.
          p = Path('app/dashboard/invoice-viewer.tsx')
          s = p.read_text()
          s = s.replace("import { Download, Edit3, FileText, Loader2, MessageCircle, Plus, Save, Trash2, X } from 'lucide-react'", "import { ArrowLeft, Download, Edit3, FileText, Loader2, MessageCircle, Plus, Save, Trash2, X } from 'lucide-react'")
          marker = "type Product = { id: string; sku: string; name: string; unit_id: string; purchase_price: number; sale_price: number; catalog_units?: { short_name?: string | null } | null }"
          insert = marker + "\ntype ProfitLine = { product_id: string; name: string; sku: string | null; quantity: number; cost_per_pc: number; sale_per_pc: number; profit_per_pc: number; total_sales: number; total_cost: number; total_profit: number }\ntype InvoiceProfit = { sales: number; cogs: number; profit: number; margin: number; lines: ProfitLine[] }"
          if marker not in s:
              raise SystemExit('invoice viewer type marker not found')
          s = s.replace(marker, insert, 1)
          state_marker = "  const [productsLoading, setProductsLoading] = useState(false)"
          s = s.replace(state_marker, state_marker + "\n  const [invoiceProfit, setInvoiceProfit] = useState<InvoiceProfit | null>(null)", 1)
          s = s.replace("      setLoading(true); setError(''); setInvoice(null); setEditing(false)", "      setLoading(true); setError(''); setInvoice(null); setInvoiceProfit(null); setEditing(false)", 1)
          old = "        setInvoice(body.invoice as Invoice)\n      } catch (err)"
          new = "        const loadedInvoice = body.invoice as Invoice\n        setInvoice(loadedInvoice)\n        if (kind === 'sale' && loadedInvoice.date) {\n          try {\n            const day = new Date(loadedInvoice.date).toISOString().slice(0, 10)\n            const reportResponse = await fetch(`/api/accounting/reports?start=${day}&end=${day}`, { cache: 'no-store' })\n            const reportBody = await reportResponse.json().catch(() => ({}))\n            const matched = reportBody?.profitAnalysis?.invoiceWise?.find((item: { invoice_no?: string }) => item.invoice_no === loadedInvoice.invoice_no)\n            if (matched) setInvoiceProfit({ sales: Number(matched.sales || 0), cogs: Number(matched.cogs || 0), profit: Number(matched.profit || 0), margin: Number(matched.margin || 0), lines: Array.isArray(matched.lines) ? matched.lines : [] })\n          } catch {\n            // Invoice remains fully usable if profit analysis is temporarily unavailable.\n          }\n        }\n      } catch (err)"
          if old not in s:
              raise SystemExit('invoice load marker not found')
          s = s.replace(old, new, 1)
          s = s.replace("  const close = () => { if (!saving && !pdfBusy) { setInvoice(null); setError(''); setEditing(false) } }", "  const close = () => { if (!saving && !pdfBusy) { setInvoice(null); setInvoiceProfit(null); setError(''); setEditing(false) } }")
          s = s.replace('return <div className="biz-invoice-viewer fixed inset-0 z-[100]', 'return <div className="biz-invoice-viewer fixed inset-0 z-[10000]')
          header_marker = "        <div className=\"flex min-w-0 shrink-0 flex-wrap items-center justify-end gap-2\">"
          header_repl = "        <div className=\"flex min-w-0 shrink-0 flex-wrap items-center justify-end gap-2\">\n          {invoice && invoiceProfit && <button type=\"button\" onClick={close} className=\"inline-flex items-center gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2 text-sm font-black text-indigo-800 hover:bg-indigo-100\"><ArrowLeft className=\"h-4 w-4\" /> Back to Profit Analysis</button>}"
          if header_marker not in s:
              raise SystemExit('viewer header marker not found')
          s = s.replace(header_marker, header_repl, 1)
          profit_marker = "        {invoice.kind === 'purchase' && ("
          profit_block = "        {invoiceProfit && invoice.kind === 'sale' && (\n          <section className=\"mb-5 rounded-2xl border border-indigo-100 bg-indigo-50/40 p-4 sm:p-5\">\n            <div className=\"flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between\">\n              <div><p className=\"text-[10px] font-black uppercase tracking-[.14em] text-indigo-600\">Profit Analysis</p><h3 className=\"mt-1 text-lg font-black text-slate-950\">Product-wise Profit / Loss</h3><p className=\"mt-1 text-xs text-slate-500\">Cost per PC, sale price per PC and realized profit for every product in this invoice.</p></div>\n              <div className=\"grid grid-cols-3 gap-2 text-right\"><div className=\"rounded-xl bg-white px-3 py-2 border\"><p className=\"text-[9px] font-black uppercase text-slate-400\">Sales</p><b>{money(invoiceProfit.sales)}</b></div><div className=\"rounded-xl bg-white px-3 py-2 border\"><p className=\"text-[9px] font-black uppercase text-slate-400\">Cost</p><b>{money(invoiceProfit.cogs)}</b></div><div className=\"rounded-xl bg-white px-3 py-2 border\"><p className=\"text-[9px] font-black uppercase text-slate-400\">Profit</p><b className={invoiceProfit.profit < 0 ? 'text-red-600' : 'text-emerald-700'}>{money(invoiceProfit.profit)}</b></div></div>\n            </div>\n            <div className=\"mt-4 overflow-x-auto rounded-xl border bg-white\"><table className=\"w-full min-w-[980px] text-sm\"><thead className=\"bg-slate-50 text-[10px] font-black uppercase tracking-wide text-slate-400\"><tr><th className=\"p-3 text-left\">Product / Model</th><th className=\"p-3 text-right\">Qty</th><th className=\"p-3 text-right\">Cost / PC</th><th className=\"p-3 text-right\">Sale / PC</th><th className=\"p-3 text-right\">Profit / PC</th><th className=\"p-3 text-right\">Total Profit</th></tr></thead><tbody className=\"divide-y\">{invoiceProfit.lines.map((line, index) => <tr key={`${line.product_id}-${index}`}><td className=\"p-3 font-black text-slate-900\">{line.name}<span className=\"ml-2 text-xs font-medium text-slate-400\">{line.sku || ''}</span></td><td className=\"p-3 text-right font-bold tabular-nums\">{line.quantity}</td><td className=\"p-3 text-right tabular-nums\">{money(line.cost_per_pc)}</td><td className=\"p-3 text-right font-bold tabular-nums\">{money(line.sale_per_pc)}</td><td className={`p-3 text-right font-black tabular-nums ${line.profit_per_pc < 0 ? 'text-red-600' : 'text-emerald-700'}`}>{money(line.profit_per_pc)}</td><td className={`p-3 text-right font-black tabular-nums ${line.total_profit < 0 ? 'text-red-600' : 'text-emerald-700'}`}>{money(line.total_profit)}</td></tr>)}</tbody></table></div>\n          </section>\n        )}\n\n" + profit_marker
          if profit_marker not in s:
              raise SystemExit('profit insertion marker not found')
          s = s.replace(profit_marker, profit_block, 1)
          p.write_text(s)
          PY
      - name: Commit changes and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-invoice-profit-page.yml
          git add app/dashboard/analysis/page.tsx app/dashboard/invoice-viewer.tsx
          git commit -m "Open P&L invoices with product-wise profit"
          git push
