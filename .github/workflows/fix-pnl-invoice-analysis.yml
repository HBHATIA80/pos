name: Fix P&L invoice analysis
on:
  push:
    paths:
      - '.pnl-invoice-fix-trigger'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply P&L invoice analysis changes
        run: python .github/pnl-invoice-fix.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/accounting/reports/route.ts app/dashboard/analysis/page.tsx
          git commit -m 'Improve invoice-wise profit analysis' || exit 0
          git push
      - name: Remove temporary fixer
        if: always()
        run: |
          git rm -f .github/workflows/fix-pnl-invoice-analysis.yml .github/pnl-invoice-fix.py .pnl-invoice-fix-trigger || true
          git commit -m 'Remove temporary P&L fixer' || exit 0
          git push
