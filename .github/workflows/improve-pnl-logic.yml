name: Improve P&L logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[pnl-logic]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch P&L logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/accounting/reports/route.ts')
          s = p.read_text()
          s = s.replace("type SaleItem = { product_id: string; quantity: number; unit_price?: number | null; discount_amount?: number | null; line_total?: number | null; product_name?: string | null; sku?: string | null }", "type SaleItem = { id?: string; product_id: string; quantity: number; unit_price?: number | null; discount_amount?: number | null; line_total?: number | null; cost_unit_price?: number | null; product_name?: string | null; sku?: string | null }")
          old_query = "supabase.from('sales_invoices').select('id,invoice_no,party_id,grand_total,sold_at,completed_at,created_at,sales_invoice_items(product_id,product_name,sku,quantity,unit_price,discount_amount,line_total)').eq('business_id', businessId).eq('status', 'completed').is('deleted_at', null).is('cancelled_at', null).gte('sold_at', iso(start)).lte('sold_at', iso(end, true)).order('sold_at'),"
          new_query = "supabase.from('sales_invoices').select('id,invoice_no,party_id,grand_total,sold_at,completed_at,created_at,sales_invoice_items(id,product_id,product_name,sku,quantity,unit_price,discount_amount,line_total,cost_unit_price)').eq('business_id', businessId).eq('status', 'completed').is('deleted_at', null).is('cancelled_at', null).gte('sold_at', iso(start)).lte('sold_at', iso(end, true)).order('sold_at'),"
          s = s.replace(old_query, new_query)
          marker = "  const { data: productRows, error: productRowsError } = await supabase"
          insert = """  const { data: returns, error: returnsError } = await supabase\n    .from('return_vouchers')\n    .select('id,return_no,return_type,party_id,source_invoice_id,return_date,grand_total,status,return_voucher_items(id,source_invoice_item_id,product_id,quantity,unit_price,discount_amount,line_total)')\n    .eq('business_id', businessId)\n    .eq('status', 'completed')\n    .gte('return_date', start)\n    .lte('return_date', end)\n    .order('return_date')\n  if (returnsError) return NextResponse.json({ error: returnsError.message }, { status: 400 })\n\n"""
          s = s.replace(marker, insert + marker, 1)
          start_old = """  const productCategoryMap = new Map((productRows ?? []).map(p => [p.id, p.category_id as string | null]))\n  const rows = lines ?? []\n  const acc = accounts ?? []\n  const groupRows = groups ?? []\n  const productCost = new Map((products ?? []).map(p => [p.product_id, n(p.purchase_price)]))\n  const weightedCostAt = buildWeightedAverageLookup((purchaseRows ?? []) as PurchaseInvoice[], productCost)\n  const categoryMap = new Map((categories ?? []).map(c => [c.id, c.name]))\n"""
          start_new = """  const productCategoryMap = new Map((productRows ?? []).map(p => [p.id, p.category_id as string | null]))\n  const rows = lines ?? []\n  const acc = accounts ?? []\n  const groupRows = groups ?? []\n  const productCost = new Map((products ?? []).map(p => [p.product_id, n(p.purchase_price)]))\n  const categoryMap = new Map((categories ?? []).map(c => [c.id, c.name]))\n  const returnRows = returns ?? []\n  const saleReturnRows = returnRows.filter(r => r.return_type === 'sale_return')\n  const purchaseReturnRows = returnRows.filter(r => r.return_type === 'purchase_return')\n  const sourceSaleItemIds = saleReturnRows.flatMap(r => (r.return_voucher_items ?? []).map(i => i.source_invoice_item_id).filter(Boolean)) as string[]\n  const { data: sourceSaleItems, error: sourceSaleItemsError } = sourceSaleItemIds.length\n    ? await supabase.from('sales_invoice_items').select('id,cost_unit_price,unit_price').in('id', [...new Set(sourceSaleItemIds)])\n    : { data: [], error: null }\n  if (sourceSaleItemsError) return NextResponse.json({ error: sourceSaleItemsError.message }, { status: 400 })\n  const sourceSaleCost = new Map((sourceSaleItems ?? []).map(i => [i.id, i.cost_unit_price == null ? null : n(i.cost_unit_price)]))\n  const costForSaleItem = (item: SaleItem) => {\n    if (item.cost_unit_price != null && Number.isFinite(n(item.cost_unit_price))) return Math.max(0, n(item.cost_unit_price))\n    return Math.max(0, productCost.get(item.product_id) ?? 0)\n  }\n  const costForReturnItem = (item: any) => {\n    const source = item.source_invoice_item_id ? sourceSaleCost.get(item.source_invoice_item_id) : null\n    if (source != null && Number.isFinite(source)) return Math.max(0, source)\n    return Math.max(0, productCost.get(item.product_id) ?? 0)\n  }\n"""
          if start_old not in s: raise SystemExit('anchor block not found')
          s = s.replace(start_old, start_new, 1)
          old_pnl = """  const allPnlAccounts = trialBalance.filter(x => x.nature === 'income' || x.nature === 'expense')\n  const purchaseAccounts = allPnlAccounts.filter(x => x.nature === 'expense' && x.group.toLowerCase().includes('purchase'))\n  const pnlAccounts = allPnlAccounts.filter(x => !(x.nature === 'expense' && x.group.toLowerCase().includes('purchase')))\n  const income = allPnlAccounts.filter(x => x.nature === 'income').reduce((s, x) => s + x.credit - x.debit, 0)\n  const totalLedgerExpense = allPnlAccounts.filter(x => x.nature === 'expense').reduce((s, x) => s + x.debit - x.credit, 0)\n  const sales = allPnlAccounts.filter(x => x.group.toLowerCase().includes('sales')).reduce((s, x) => s + x.credit - x.debit, 0)\n  const purchases = purchaseAccounts.reduce((s, x) => s + x.debit - x.credit, 0)\n  const operatingExpense = Math.max(totalLedgerExpense - purchases, 0)\n  const otherIncome = Math.max(income - sales, 0)\n"""
          new_pnl = """  const allPnlAccounts = trialBalance.filter(x => x.nature === 'income' || x.nature === 'expense')\n  const purchaseAccounts = allPnlAccounts.filter(x => x.nature === 'expense' && x.group.toLowerCase().includes('purchase'))\n  const pnlAccounts = allPnlAccounts.filter(x => !(x.nature === 'expense' && x.group.toLowerCase().includes('purchase')))\n  const ledgerOtherIncome = allPnlAccounts.filter(x => x.nature === 'income' && !x.group.toLowerCase().includes('sales')).reduce((sum, x) => sum + x.credit - x.debit, 0)\n  const totalLedgerExpense = allPnlAccounts.filter(x => x.nature === 'expense').reduce((sum, x) => sum + x.debit - x.credit, 0)\n  const purchases = purchaseAccounts.reduce((sum, x) => sum + x.debit - x.credit, 0)\n  const purchaseReturns = purchaseReturnRows.reduce((sum, r) => sum + n(r.grand_total), 0)\n  const netPurchases = purchases - purchaseReturns\n  const operatingExpense = totalLedgerExpense - purchases\n  const otherIncome = ledgerOtherIncome\n"""
          if old_pnl not in s: raise SystemExit('pnl block not found')
          s = s.replace(old_pnl, new_pnl, 1)
          loop_old = """  for (const invoice of salesRows ?? []) {\n    const saleDate = String(invoice.sold_at ?? invoice.completed_at ?? invoice.created_at ?? '')\n    const invoiceSales = n(invoice.grand_total)\n    const invoiceCogs = 0\n    const invoiceName = 'Walk-in / Other'\n    if (invoice.party_id) partyIds.add(invoice.party_id)\n    invoicePartyMap.set(invoice.id, invoice.party_id ?? '')\n    const items = (invoice.sales_invoice_items ?? []) as SaleItem[]\n\n    let calculatedInvoiceCogs = invoiceCogs\n    for (const item of items) {\n      const qty = n(item.quantity)\n      const lineSales = item.line_total == null ? n(item.unit_price) * qty - n(item.discount_amount) : n(item.line_total)\n      const avgCost = weightedCostAt(item.product_id, saleDate)\n      const lineCogs = qty * avgCost\n"""
          loop_new = """  let grossSales = 0\n  let salesReturns = 0\n  let cogsBeforeReturns = 0\n  let saleCostMissing = 0\n\n  for (const invoice of salesRows ?? []) {\n    const saleDate = String(invoice.sold_at ?? invoice.completed_at ?? invoice.created_at ?? '')\n    const invoiceSales = n(invoice.grand_total)\n    grossSales += invoiceSales\n    const invoiceName = 'Walk-in / Other'\n    if (invoice.party_id) partyIds.add(invoice.party_id)\n    invoicePartyMap.set(invoice.id, invoice.party_id ?? '')\n    const items = (invoice.sales_invoice_items ?? []) as SaleItem[]\n\n    let calculatedInvoiceCogs = 0\n    for (const item of items) {\n      const qty = n(item.quantity)\n      const lineSales = item.line_total == null ? n(item.unit_price) * qty - n(item.discount_amount) : n(item.line_total)\n      const hasStoredCost = item.cost_unit_price != null\n      const lineCost = costForSaleItem(item)\n      if (!hasStoredCost && lineCost <= 0) saleCostMissing += 1\n      const lineCogs = qty * lineCost\n      cogsBeforeReturns += lineCogs\n"""
          if loop_old not in s: raise SystemExit('sale loop anchor not found')
          s = s.replace(loop_old, loop_new, 1)
          s = s.replace("      const old = profitProducts.get(item.product_id) ?? { product_id: item.product_id, name: productName, sku, quantity: 0, sales: 0, cogs: 0, profit: 0, margin: 0, average_purchase_cost: avgCost }", "      const old = profitProducts.get(item.product_id) ?? { product_id: item.product_id, name: productName, sku, quantity: 0, sales: 0, cogs: 0, profit: 0, margin: 0, average_purchase_cost: lineCost }")
          s = s.replace("      old.quantity += qty; old.sales += lineSales; old.cogs += lineCogs; old.profit += lineProfit; old.average_purchase_cost = avgCost; old.margin = marginOf(old.sales, old.profit)", "      old.quantity += qty; old.sales += lineSales; old.cogs += lineCogs; old.profit += lineProfit; old.average_purchase_cost = lineCost; old.margin = marginOf(old.sales, old.profit)")
          s = s.replace("    const invProfit = invoiceSales - calculatedInvoiceCogs", "    const invProfit = invoiceSales - calculatedInvoiceCogs")
          anchor = """  const cogs = [...profitProducts.values()].reduce((sum, row) => sum + row.cogs, 0)\n  const grossProfit = sales - cogs\n  const netProfit = grossProfit + otherIncome - operatingExpense\n"""
          replacement = """  const returnCogs = saleReturnRows.reduce((sum, r) => sum + (r.return_voucher_items ?? []).reduce((inner, item) => inner + n(item.quantity) * costForReturnItem(item), 0), 0)\n  for (const ret of saleReturnRows) {\n    const returnSales = n(ret.grand_total)\n    salesReturns += returnSales\n    const returnCogsValue = (ret.return_voucher_items ?? []).reduce((sum, item) => sum + n(item.quantity) * costForReturnItem(item), 0)\n    const partyName = ret.party_id ? `Party ${ret.party_id.slice(0, 8)}` : 'Walk-in / Other'\n    profitInvoices.push({ invoice_id: ret.id, invoice_no: ret.return_no, date: String(ret.return_date).slice(0, 10), party_id: ret.party_id ?? null, party_name: partyName, sales: -returnSales, cogs: -returnCogsValue, profit: -returnSales + returnCogsValue, margin: marginOf(-returnSales, -returnSales + returnCogsValue) })\n    const items = (ret.return_voucher_items ?? []) as any[]\n    for (const item of items) {\n      const qty = n(item.quantity)\n      const lineSales = n(item.line_total)\n      const lineCogs = qty * costForReturnItem(item)\n      const product = productMeta.get(item.product_id)\n      const productName = product?.name ?? 'Unknown product'\n      const sku = product?.sku ?? null\n      const old = profitProducts.get(item.product_id) ?? { product_id: item.product_id, name: productName, sku, quantity: 0, sales: 0, cogs: 0, profit: 0, margin: 0, average_purchase_cost: costForReturnItem(item) }\n      old.quantity -= qty; old.sales -= lineSales; old.cogs -= lineCogs; old.profit -= (lineSales - lineCogs); old.margin = marginOf(old.sales, old.profit)\n      profitProducts.set(item.product_id, old)\n      const categoryId = productCategoryMap.get(item.product_id) ?? null\n      const categoryName = categoryId ? (categoryMap.get(categoryId) ?? 'Uncategorised') : 'Uncategorised'\n      const categoryKey = categoryId ?? '__uncategorised__'\n      const cat = profitCategories.get(categoryKey) ?? { category_id: categoryId, name: categoryName, sales: 0, cogs: 0, profit: 0, margin: 0 }\n      cat.sales -= lineSales; cat.cogs -= lineCogs; cat.profit -= (lineSales - lineCogs); cat.margin = marginOf(cat.sales, cat.profit)\n      profitCategories.set(categoryKey, cat)\n    }\n    const partyKey = ret.party_id ?? '__walkin__'\n    const party = profitParties.get(partyKey) ?? { party_id: ret.party_id ?? null, name: partyName, invoices: 0, sales: 0, cogs: 0, profit: 0, margin: 0 }\n    party.sales -= returnSales; party.cogs -= returnCogsValue; party.profit -= (returnSales - returnCogsValue); party.margin = marginOf(party.sales, party.profit); profitParties.set(partyKey, party)\n  }\n\n  const cogs = cogsBeforeReturns - returnCogs\n  const sales = grossSales - salesReturns\n  const income = sales + otherIncome\n  const grossProfit = sales - cogs\n  const netProfit = grossProfit + otherIncome - operatingExpense\n"""
          if anchor not in s: raise SystemExit('summary anchor not found')
          s = s.replace(anchor, replacement, 1)
          # Remove the now-invalid earlier sales usage by ensuring no duplicate declaration survives.
          s = s.replace("  const returnCogs = saleReturnRows.reduce((sum, r) => sum + (r.return_voucher_items ?? []).reduce((inner, item) => inner + n(item.quantity) * costForReturnItem(item), 0), 0)\n", "  const returnCogs = saleReturnRows.reduce((sum, r) => sum + (r.return_voucher_items ?? []).reduce((inner, item) => inner + n(item.quantity) * costForReturnItem(item), 0), 0)\n", 1)
          # Replace the old daily calculation with a P&L-consistent source-of-truth calculation.
          daily_start = s.index("  const dailyMap = new Map<string, { sales:number; purchases:number; cogs:number; expenses:number; otherIncome:number; entries:number }>()")
          daily_end = s.index("  return NextResponse.json({", daily_start)
          daily_block = """  const dailyMap = new Map<string, { sales:number; purchases:number; cogs:number; expenses:number; otherIncome:number; entries:number; salesReturns:number; purchaseReturns:number }>()\n  for (const r of rows) {\n    const date = String(r.entry_date).slice(0, 10)\n    const m = dailyMap.get(date) || { sales:0, purchases:0, cogs:0, expenses:0, otherIncome:0, entries:0, salesReturns:0, purchaseReturns:0 }\n    const meta = accountMeta.get(r.account_id)\n    const debit = n(r.debit), credit = n(r.credit)\n    const group = (meta?.group || '').toLowerCase()\n    const nature = meta?.account_nature || ''\n    m.entries += 1\n    if (nature === 'income' && !group.includes('sales')) m.otherIncome += credit - debit\n    else if (nature === 'expense' && !group.includes('purchase')) m.expenses += debit - credit\n    dailyMap.set(date, m)\n  }\n  for (const invoice of salesRows ?? []) {\n    const date = String(invoice.sold_at ?? invoice.completed_at ?? invoice.created_at ?? '').slice(0, 10)\n    const m = dailyMap.get(date) || { sales:0, purchases:0, cogs:0, expenses:0, otherIncome:0, entries:0, salesReturns:0, purchaseReturns:0 }\n    m.sales += n(invoice.grand_total)\n    m.cogs += (invoice.sales_invoice_items ?? []).reduce((sum, item) => sum + n(item.quantity) * costForSaleItem(item as SaleItem), 0)\n    dailyMap.set(date, m)\n  }\n  for (const ret of saleReturnRows) {\n    const date = String(ret.return_date).slice(0, 10)\n    const m = dailyMap.get(date) || { sales:0, purchases:0, cogs:0, expenses:0, otherIncome:0, entries:0, salesReturns:0, purchaseReturns:0 }\n    m.salesReturns += n(ret.grand_total)\n    m.sales -= n(ret.grand_total)\n    m.cogs -= (ret.return_voucher_items ?? []).reduce((sum, item) => sum + n(item.quantity) * costForReturnItem(item), 0)\n    dailyMap.set(date, m)\n  }\n  for (const ret of purchaseReturnRows) {\n    const date = String(ret.return_date).slice(0, 10)\n    const m = dailyMap.get(date) || { sales:0, purchases:0, cogs:0, expenses:0, otherIncome:0, entries:0, salesReturns:0, purchaseReturns:0 }\n    m.purchaseReturns += n(ret.grand_total)\n    dailyMap.set(date, m)\n  }\n  const daily = [...dailyMap.entries()].sort(([a],[b]) => a.localeCompare(b)).map(([date,m]) => ({ ...m, date, netSales: m.sales, grossProfit: m.sales-m.cogs, netProfit: m.sales-m.cogs+m.otherIncome-m.expenses }))\n  const today = dailyMap.get(end) || { sales:0, purchases:0, cogs:0, expenses:0, otherIncome:0, entries:0, salesReturns:0, purchaseReturns:0 }\n  const todayGrossProfit = today.sales - today.cogs\n  const todayNetProfit = todayGrossProfit + today.otherIncome - today.expenses\n\n"""
          s = s[:daily_start] + daily_block + s[daily_end:]
          # Expand summary payload with explicit P&L components and cost quality indicators.
          old_summary = "summary: { income, expense: operatingExpense, totalExpense: totalLedgerExpense, operatingExpense, sales, purchases, costOfGoodsSold: cogs, grossProfit, netProfit, otherIncome, assets, liabilities, equity, debtors, creditors, cash, bank, stock, todaySales: today.sales, todayGrossProfit, todayNetProfit, todayExpenses: today.expenses, todayCogs: today.cogs, todayOtherIncome: today.otherIncome, trialDebit: trialBalance.reduce((s,x)=>s+x.debit,0), trialCredit: trialBalance.reduce((s,x)=>s+x.credit,0) }"
          new_summary = "summary: { income, expense: operatingExpense, totalExpense: totalLedgerExpense, operatingExpense, grossSales, salesReturns, netSales: sales, sales, purchases, purchaseReturns, netPurchases, costOfGoodsSold: cogs, grossProfit, netProfit, otherIncome, assets, liabilities, equity, debtors, creditors, cash, bank, stock, uncostedSalesLines: saleCostMissing, todaySales: today.sales, todayGrossProfit, todayNetProfit, todayExpenses: today.expenses, todayCogs: today.cogs, todayOtherIncome: today.otherIncome, trialDebit: trialBalance.reduce((s,x)=>s+x.debit,0), trialCredit: trialBalance.reduce((s,x)=>s+x.credit,0) }"
          if old_summary not in s: raise SystemExit('summary payload anchor not found')
          s = s.replace(old_summary, new_summary, 1)
          p.write_text(s)

          p = Path('app/dashboard/analysis/page.tsx')
          s = p.read_text()
          s = s.replace("summary:{income:number;expense:number;sales:number;purchases:number;costOfGoodsSold:number;grossProfit:number;netProfit:number;assets:number;liabilities:number;equity:number;debtors:number;creditors:number;cash:number;bank:number;stock:number;trialDebit:number;trialCredit:number}", "summary:{income:number;expense:number;sales:number;grossSales:number;salesReturns:number;netSales:number;purchases:number;purchaseReturns:number;netPurchases:number;costOfGoodsSold:number;grossProfit:number;netProfit:number;otherIncome:number;uncostedSalesLines:number;assets:number;liabilities:number;equity:number;debtors:number;creditors:number;cash:number;bank:number;stock:number;trialDebit:number;trialCredit:number}")
          s = s.replace("['P&L','Amount'],['Sales',data.summary.sales],['Cost of Goods Sold',data.summary.costOfGoodsSold],['Gross Profit',data.summary.grossProfit],['Other Income',data.summary.income-data.summary.sales],['Operating Expenses',data.summary.expense],['Net Profit / Loss',data.summary.netProfit],[],['Inventory Purchases (Balance Sheet / Stock)',data.summary.purchases]", "['P&L','Amount'],['Gross Sales',data.summary.grossSales],['Sales Returns',-data.summary.salesReturns],['Net Sales',data.summary.netSales],['Cost of Goods Sold',-data.summary.costOfGoodsSold],['Gross Profit',data.summary.grossProfit],['Other Income',data.summary.otherIncome],['Operating Expenses',-data.summary.expense],['Net Profit / Loss',data.summary.netProfit],[],['Inventory Purchases',data.summary.purchases],['Purchase Returns',-data.summary.purchaseReturns],['Net Purchases (Inventory)',data.summary.netPurchases]")
          s = s.replace("<Metric label=\"Sales\" value={s.sales}/><Metric label=\"Cost of Goods Sold\" value={-s.costOfGoodsSold}/><Metric label=\"Gross Profit\" value={s.grossProfit}/><Metric label=\"Other Income\" value={s.income-s.sales}/><Metric label=\"Operating Expenses\" value={-s.expense}/>", "<Metric label=\"Gross Sales\" value={s.grossSales}/><Metric label=\"Sales Returns\" value={-s.salesReturns}/><Metric label=\"Net Sales\" value={s.netSales}/><Metric label=\"Cost of Goods Sold\" value={-s.costOfGoodsSold}/><Metric label=\"Gross Profit\" value={s.grossProfit}/><Metric label=\"Other Income\" value={s.otherIncome}/><Metric label=\"Operating Expenses\" value={-s.expense}/>")
          s = s.replace("<Metric label=\"NET PROFIT / LOSS\" value={s.netProfit} strong/></div></div><div className=\"mt-5 rounded-xl bg-amber-50 p-4 text-sm\"><p className=\"font-bold text-amber-900\">Inventory accounting</p>", "<Metric label=\"NET PROFIT / LOSS\" value={s.netProfit} strong/></div></div><div className=\"mt-5 rounded-xl bg-amber-50 p-4 text-sm\"><p className=\"font-bold text-amber-900\">Inventory accounting</p>")
          s = s.replace("Purchases of ₹{Number(s.purchases||0).toLocaleString('en-IN',{maximumFractionDigits:0})} are inventory, not an immediate P&L expense. They remain in stock until sold.", "Purchases are inventory, not an immediate P&L expense. Net purchases are ₹{Number(s.netPurchases||0).toLocaleString('en-IN',{maximumFractionDigits:0})}. Only the cost attached to units actually sold is recognized in COGS. Sales returns reduce revenue and reverse the related COGS.")
          s = s.replace("<div className=\"mt-3 rounded-xl bg-slate-50 p-4 text-sm\"><p className=\"font-bold\">Margins</p>", "<div className=\"mt-3 rounded-xl bg-slate-50 p-4 text-sm\"><p className=\"font-bold\">Margins</p>")
          s = s.replace("<div className=\"mt-1 flex justify-between\"><span>Net margin</span><b>{pct(netMargin)}</b></div></div></section></div>}", "<div className=\"mt-1 flex justify-between\"><span>Net margin</span><b>{pct(netMargin)}</b></div>{s.uncostedSalesLines>0&&<div className=\"mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs font-bold text-red-700\">{s.uncostedSalesLines} sales line(s) have no stored cost; fallback product cost was used.</div>}</div></section></div>}")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/improve-pnl-logic.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/api/accounting/reports/route.ts app/dashboard/analysis/page.tsx .github/workflows/improve-pnl-logic.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve P&L analysis logic [pnl-logic]"
          git push
