name: Fix P&L invoice modal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invoice modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/analysis/page.tsx')
          s = p.read_text()

          s = s.replace('Download, FileText, Loader2, RefreshCw, TrendingDown, TrendingUp, WalletCards, X, Eye', 'Download, FileText, Loader2, RefreshCw, TrendingDown, TrendingUp, WalletCards, X, Eye, ArrowLeft')

          marker = '  {selectedInvoice && ('
          start = s.find(marker)
          if start < 0:
              raise SystemExit('selectedInvoice modal marker not found')

          # Find the matching closing parenthesis for the JSX conditional expression.
          pos = s.find('(', start)
          depth = 0
          quote = None
          escape = False
          i = pos
          end = None
          while i < len(s):
              c = s[i]
              if quote:
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == quote:
                      quote = None
              else:
                  if c in "'\"`":
                      quote = c
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          if end is None:
              raise SystemExit('could not find modal end')

          replacement = '''  {selectedInvoice && (\n   <div className="fixed inset-0 z-[10000] flex items-center justify-center bg-slate-950/60 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-label={`Profit details for ${selectedInvoice.invoice_no}`}>\n    <div className="relative flex max-h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">\n     <div className="sticky top-0 z-20 flex items-center justify-between gap-3 border-b bg-white px-4 py-3 sm:px-6 sm:py-4">\n      <div className="min-w-0">\n       <div className="flex items-center gap-2">\n        <span className="rounded-lg bg-indigo-50 p-2 text-indigo-700"><FileText className="h-4 w-4"/></span>\n        <div className="min-w-0">\n         <h3 className="truncate text-base font-black text-slate-950 sm:text-lg">Invoice Profit Details</h3>\n         <p className="truncate text-xs font-semibold text-slate-500">{selectedInvoice.invoice_no} · {selectedInvoice.date} · {selectedInvoice.party_name}</p>\n        </div>\n       </div>\n      </div>\n      <div className="flex shrink-0 items-center gap-2">\n       <button onClick={()=>setSelectedInvoice(null)} className="inline-flex min-h-10 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-xs font-black text-slate-700 hover:bg-slate-50" aria-label="Back to invoice list"><ArrowLeft className="h-4 w-4"/><span className="hidden sm:inline">Back</span></button>\n       <button onClick={()=>setSelectedInvoice(null)} className="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50" aria-label="Close"><X className="h-4 w-4"/></button>\n      </div>\n     </div>\n     <div className="min-h-0 overflow-y-auto p-3 sm:p-5">\n      <div className="grid gap-3 sm:grid-cols-4">\n       <div className="rounded-xl border bg-slate-50 p-3"><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Sales</p><p className="mt-1 text-lg font-black text-slate-950">{money(selectedInvoice.sales)}</p></div>\n       <div className="rounded-xl border bg-slate-50 p-3"><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Cost</p><p className="mt-1 text-lg font-black text-slate-950">{money(selectedInvoice.cogs)}</p></div>\n       <div className="rounded-xl border bg-emerald-50 p-3"><p className="text-[10px] font-black uppercase tracking-wide text-emerald-700">Total Profit</p><p className={`mt-1 text-lg font-black ${selectedInvoice.profit<0?'text-red-600':'text-emerald-700'}`}>{money(selectedInvoice.profit)}</p></div>\n       <div className="rounded-xl border bg-slate-50 p-3"><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Margin</p><p className="mt-1 text-lg font-black text-slate-950">{pct(selectedInvoice.margin)}</p></div>\n      </div>\n      <div className="mt-5 overflow-hidden rounded-xl border border-slate-200">\n       <div className="border-b bg-slate-50 px-4 py-3"><h4 className="text-sm font-black text-slate-900">Model-wise Profitability</h4><p className="mt-0.5 text-xs text-slate-500">Cost and selling price are shown per piece, with profit calculated separately for every model line.</p></div>\n       <div className="overflow-x-auto">\n        <table className="min-w-[1120px] w-full text-sm">\n         <thead className="bg-white text-[10px] font-black uppercase tracking-wide text-slate-400"><tr><th className="p-3 text-left">Model / Product</th><th className="p-3 text-right">Qty</th><th className="p-3 text-right">Cost / PC</th><th className="p-3 text-right">Sale / PC</th><th className="p-3 text-right">Profit / PC</th><th className="p-3 text-right">Total Sales</th><th className="p-3 text-right">Total Cost</th><th className="p-3 text-right">Total Profit</th></tr></thead>\n         <tbody className="divide-y">\n          {selectedInvoice.lines.map((line,idx)=><tr key={`${line.product_id}-${idx}`} className="hover:bg-slate-50"><td className="p-3"><div className="max-w-[300px] font-black text-slate-900">{line.name}</div>{line.sku&&<div className="mt-0.5 text-[11px] font-semibold text-slate-400">{line.sku}</div>}</td><td className="p-3 text-right font-bold tabular-nums">{line.quantity}</td><td className="p-3 text-right tabular-nums">{money(line.cost_per_pc)}</td><td className="p-3 text-right font-bold tabular-nums">{money(line.sale_per_pc)}</td><td className={`p-3 text-right font-black tabular-nums ${line.profit_per_pc<0?'text-red-600':'text-emerald-700'}`}>{money(line.profit_per_pc)}</td><td className="p-3 text-right font-semibold tabular-nums">{money(line.total_sales)}</td><td className="p-3 text-right tabular-nums">{money(line.total_cost)}</td><td className={`p-3 text-right font-black tabular-nums ${line.total_profit<0?'text-red-600':'text-emerald-700'}`}>{money(line.total_profit)}</td></tr>)}\n         </tbody>\n        </table>\n       </div>\n      </div>\n     </div>\n    </div>\n   </div>\n  )}'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-pnl-invoice-modal.yml
          git add app/dashboard/analysis/page.tsx .github/workflows/fix-pnl-invoice-modal.yml
          git commit -m "Fix P&L invoice detail modal layering and navigation"
          git push