name: Refresh npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch P&L invoice modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/analysis/page.tsx'); s=p.read_text()
          marker='  {selectedInvoice&&<div'
          start=s.find(marker)
          if start<0: raise SystemExit('invoice modal marker not found')
          end=s.find('\n}\nfunction ReportCard', start)
          if end<0: raise SystemExit('invoice modal end marker not found')
          s=s[:start]+'''  {selectedInvoice&&<div className="fixed inset-0 z-[10000] flex items-center justify-center bg-slate-950/70 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" onMouseDown={e=>{if(e.target===e.currentTarget)setSelectedInvoice(null)}}><section className="relative flex max-h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl border-2 border-slate-200 bg-white shadow-2xl"><header className="sticky top-0 z-20 flex shrink-0 items-center justify-between gap-3 border-b bg-white px-4 py-3 sm:px-6 sm:py-4"><div className="min-w-0 flex items-center gap-2"><span className="rounded-lg bg-indigo-50 p-2 text-indigo-700"><FileText className="h-4 w-4"/></span><div className="min-w-0"><p className="text-[10px] font-black uppercase tracking-[.16em] text-indigo-600">Profit Analysis · Invoice</p><h2 className="mt-0.5 truncate text-lg font-black text-slate-950 sm:text-xl">{selectedInvoice.invoice_no}</h2><p className="mt-0.5 truncate text-xs font-semibold text-slate-500">{selectedInvoice.date} · {selectedInvoice.party_name}</p></div></div><div className="flex shrink-0 items-center gap-2"><button onClick={()=>setSelectedInvoice(null)} className="inline-flex min-h-10 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-xs font-black text-slate-700 hover:bg-slate-50" aria-label="Back to invoice list"><ArrowLeft className="h-4 w-4"/><span className="hidden sm:inline">Back</span></button><button onClick={()=>setSelectedInvoice(null)} className="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50" aria-label="Close"><X className="h-4 w-4"/></button></div></header><div className="min-h-0 flex-1 overflow-auto p-3 sm:p-6"><div className="grid gap-3 sm:grid-cols-4"><Kpi title="Invoice Sales" value={money(selectedInvoice.sales)} hint="Net realized sales"/><Kpi title="Cost" value={money(selectedInvoice.cogs)} hint="Cost of goods sold"/><Kpi title="Total Profit" value={money(selectedInvoice.profit)} hint="Sales less cost"/><Kpi title="Margin" value={pct(selectedInvoice.margin)} hint="Profit / sales"/></div><div className="mt-5 overflow-hidden rounded-xl border"><div className="border-b bg-slate-50 px-4 py-3"><h3 className="text-sm font-black text-slate-900">Model-wise Profitability</h3><p className="mt-0.5 text-xs text-slate-500">Per-piece cost, sale price and profit for every model in this invoice.</p></div><div className="overflow-x-auto"><table className="min-w-[1120px] w-full text-sm"><thead className="bg-white text-left text-[10px] font-black uppercase tracking-wide text-slate-400"><tr><th className="p-3">Model / Product</th><th className="p-3">SKU</th><th className="p-3 text-right">Qty</th><th className="p-3 text-right">Cost / PC</th><th className="p-3 text-right">Sale / PC</th><th className="p-3 text-right">Profit / PC</th><th className="p-3 text-right">Total Sales</th><th className="p-3 text-right">Total Cost</th><th className="p-3 text-right">Total Profit</th></tr></thead><tbody className="divide-y">{selectedInvoice.lines.map((line,i)=><tr key={`${line.product_id}-${i}`} className="hover:bg-slate-50"><td className="p-3 font-black text-slate-900">{line.name}</td><td className="p-3 text-slate-500">{line.sku||'—'}</td><td className="p-3 text-right font-bold tabular-nums">{line.quantity}</td><td className="p-3 text-right tabular-nums">{money(line.cost_per_pc)}</td><td className="p-3 text-right font-bold tabular-nums">{money(line.sale_per_pc)}</td><td className={`p-3 text-right font-black tabular-nums ${line.profit_per_pc<0?'text-red-600':'text-emerald-700'}`}>{money(line.profit_per_pc)}</td><td className="p-3 text-right tabular-nums">{money(line.total_sales)}</td><td className="p-3 text-right tabular-nums">{money(line.total_cost)}</td><td className={`p-3 text-right font-black tabular-nums ${line.total_profit<0?'text-red-600':'text-emerald-700'}`}>{money(line.total_profit)}</td></tr>)}</tbody><tfoot className="border-t bg-slate-50 font-black"><tr><td className="p-3" colSpan={6}>TOTAL</td><td className="p-3 text-right">{money(selectedInvoice.sales)}</td><td className="p-3 text-right">{money(selectedInvoice.cogs)}</td><td className="p-3 text-right">{money(selectedInvoice.profit)}</td></tr></tfoot></table></div></div></div></section></div>}''' + s[end:]
          # Ensure icon import exists.
          if 'ArrowLeft' not in s.split("from 'lucide-react'")[0] and 'ArrowLeft' not in s.split("from 'lucide-react'")[1].split('\n')[0]:
              pass
          old="import { BarChart3, BookOpen, CalendarDays, Download, FileText, Loader2, RefreshCw, TrendingDown, TrendingUp, WalletCards, X, Eye } from 'lucide-react'"
          new="import { BarChart3, BookOpen, CalendarDays, Download, FileText, Loader2, RefreshCw, TrendingDown, TrendingUp, WalletCards, X, Eye, ArrowLeft } from 'lucide-react'"
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Restore refresh workflow and commit
        run: |
          cat > .github/workflows/refresh-lock.yml <<'EOF'
          name: Refresh npm lockfile

          on:
            push:
              branches: [main]

          permissions:
            contents: write

          jobs:
            refresh:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v6
                  with:
                    node-version: 24
                - run: npm install --package-lock-only --ignore-scripts
                - name: Commit generated lockfile
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add package-lock.json
                    if git diff --cached --quiet; then
                      echo "Lockfile already up to date"
                    else
                      git commit -m "chore: regenerate package lock"
                      git push
                    fi
          EOF
          rm -f .github/workflows/fix-pnl-invoice-modal.yml .github/workflows/apply-pnl-modal-fix.yml .pnl-modal-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/analysis/page.tsx .github/workflows/refresh-lock.yml .github/workflows/fix-pnl-invoice-modal.yml .github/workflows/apply-pnl-modal-fix.yml .pnl-modal-trigger
          git commit -m "Fix P&L invoice detail modal layering and navigation"
          git push