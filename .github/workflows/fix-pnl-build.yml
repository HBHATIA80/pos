name: Fix P&L build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[pnl-build-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove explicit any
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/accounting/reports/route.ts')
          s=p.read_text()
          s=s.replace("type SaleItem = { id?: string; product_id: string; quantity: number; unit_price?: number | null; discount_amount?: number | null; line_total?: number | null; cost_unit_price?: number | null; product_name?: string | null; sku?: string | null }", "type SaleItem = { id?: string; product_id: string; quantity: number; unit_price?: number | null; discount_amount?: number | null; line_total?: number | null; cost_unit_price?: number | null; product_name?: string | null; sku?: string | null }\ntype ReturnItem = { id?: string; source_invoice_item_id?: string | null; product_id: string; quantity: number; unit_price?: number | null; discount_amount?: number | null; line_total?: number | null }")
          s=s.replace("const costForReturnItem = (item: any)", "const costForReturnItem = (item: ReturnItem)")
          s=s.replace("const items = (ret.return_voucher_items ?? []) as any[]", "const items = (ret.return_voucher_items ?? []) as ReturnItem[]")
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-pnl-build.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/api/accounting/reports/route.ts .github/workflows/fix-pnl-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix P&L build typing [pnl-build-fix]"
          git push
