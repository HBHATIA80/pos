name: Fix sales dropdown layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dropdown stacking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/sales/page.tsx')
          s = p.read_text()
          old = '{showProducts && <div className="absolute left-0 right-0 top-[78px] z-40 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">'
          new = '{showProducts && <div className="absolute left-0 right-0 top-[78px] z-[100] overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">'
          if old not in s:
              raise SystemExit('Expected product dropdown markup was not found')
          s = s.replace(old, new, 1)
          old_parent = '<div className="relative">\n              <label className="mb-1.5 block text-[11px] font-black uppercase tracking-wider text-slate-700">Product / Barcode</label>'
          new_parent = '<div className="relative z-[100]">\n              <label className="mb-1.5 block text-[11px] font-black uppercase tracking-wider text-slate-700">Product / Barcode</label>'
          if old_parent not in s:
              raise SystemExit('Expected product field wrapper was not found')
          s = s.replace(old_parent, new_parent, 1)
          old_items = '<section className="flex min-h-[520px] flex-1 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">'
          new_items = '<section className="relative z-0 flex min-h-[520px] flex-1 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">'
          if old_items not in s:
              raise SystemExit('Expected invoice items section was not found')
          s = s.replace(old_items, new_items, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/sales/page.tsx
          git commit -m "fix: keep clear and hold out of product dropdown" || true
          rm -f .github/workflows/fix-sales-dropdown-layer.yml
          git add -A
          git commit -m "chore: remove temporary dropdown fix workflow" || true
          git push
